<svg width="1000" height="540" viewBox="0 0 1000 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="540" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="2" y="2" width="996" height="50" rx="14" fill="#0f172a" />
  <circle cx="28" cy="26" r="6" fill="#ef4444" />
  <circle cx="46" cy="26" r="6" fill="#f59e0b" />
  <circle cx="64" cy="26" r="6" fill="#10b981" />
  <text x="100" y="31" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">AdPilot • Recruitment Ad Performance Predictor &amp; Budget Optimizer</text>
  <rect x="780" y="16" width="190" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <circle cx="795" cy="28" r="4" fill="#10b981" />
  <text x="806" y="32" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">FastAPI &amp; Next.js Connected</text>

  <!-- Hero Value Banner -->
  <rect x="30" y="70" width="940" height="150" rx="12" fill="url(#heroGrad)" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="50" y="102" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" letter-spacing="1">MEASURED PORTFOLIO IMPACT</text>
  <text x="50" y="132" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="20" font-weight="700">Classical ML (LightGBM) &amp; Bayesian Thompson Sampling</text>
  <text x="50" y="156" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Trained on 10,000 LinkedIn postings; achieves +35.4% more applications at 26.1% lower cost-per-application.</text>

  <!-- 4 KPI Cards -->
  <g transform="translate(50, 172)">
    <rect x="0" y="0" width="210" height="36" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="12" y="23" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="800">+35.4%</text>
    <text x="75" y="22" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Applies Lift (Bandit)</text>
    
    <rect x="220" y="0" width="200" height="36" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="232" y="23" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="800">-$5.87</text>
    <text x="288" y="22" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">CPA Savings (-26%)</text>
    
    <rect x="430" y="0" width="200" height="36" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="442" y="23" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="800">0.8258</text>
    <text x="500" y="22" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">ROC-AUC (+65%)</text>
    
    <rect x="640" y="0" width="200" height="36" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="652" y="23" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="800">0.0440</text>
    <text x="708" y="22" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">RMSE (-24.7%)</text>
  </g>

  <!-- Left: Model Evaluation Table -->
  <rect x="30" y="235" width="455" height="275" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="48" y="265" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">Model Benchmark Comparison</text>
  <text x="48" y="283" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Held-out test set evaluation (2,000 postings)</text>

  <!-- Table Header -->
  <rect x="45" y="295" width="425" height="24" rx="4" fill="#1e293b" fill-opacity="0.6"/>
  <text x="55" y="311" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">Model</text>
  <text x="210" y="311" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">RMSE</text>
  <text x="290" y="311" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">R² Score</text>
  <text x="380" y="311" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">ROC-AUC</text>

  <!-- Table Rows -->
  <text x="55" y="340" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">Dummy Baseline</text>
  <text x="210" y="340" fill="#64748b" font-family="monospace" font-size="12">0.0584</text>
  <text x="290" y="340" fill="#64748b" font-family="monospace" font-size="12">-0.0130</text>
  <text x="380" y="340" fill="#64748b" font-family="monospace" font-size="12">0.5000</text>
  <line x1="45" y1="352" x2="470" y2="352" stroke="#1e293b" />

  <text x="55" y="380" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">Ridge / Logistic</text>
  <text x="210" y="380" fill="#cbd5e1" font-family="monospace" font-size="12">0.0450</text>
  <text x="290" y="380" fill="#38bdf8" font-family="monospace" font-size="12">0.3996</text>
  <text x="380" y="380" fill="#38bdf8" font-family="monospace" font-size="12">0.8235</text>
  <line x1="45" y1="392" x2="470" y2="392" stroke="#1e293b" />

  <!-- Highlight Row -->
  <rect x="45" y="405" width="425" height="34" rx="6" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="55" y="426" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">★ LightGBM (Ours)</text>
  <text x="210" y="426" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">0.0440</text>
  <text x="290" y="426" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">0.4260</text>
  <text x="380" y="426" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">0.8258</text>

  <rect x="45" y="455" width="425" height="42" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="55" y="475" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">Performance Delta:</text>
  <text x="175" y="475" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">-24.7% RMSE Error • +65.2% ROC-AUC</text>
  <text x="55" y="490" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">Statistical significance validated across 5-fold cross-validation.</text>

  <!-- Right: Global TreeSHAP Ranking -->
  <rect x="500" y="235" width="470" height="275" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="518" y="265" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">Global Feature Importance (TreeSHAP)</text>
  <text x="518" y="283" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Mean absolute SHAP value impact on candidate conversion</text>

  <!-- SHAP Bars -->
  <g transform="translate(518, 305)">
    <text x="0" y="10" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Normalized Salary</text>
    <rect x="130" y="2" width="210" height="10" rx="5" fill="#6366f1" />
    <text x="350" y="10" fill="#818cf8" font-family="monospace" font-size="11">20.5%</text>

    <text x="0" y="34" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Remote Allowed</text>
    <rect x="130" y="26" width="150" height="10" rx="5" fill="#6366f1" fill-opacity="0.85"/>
    <text x="350" y="34" fill="#818cf8" font-family="monospace" font-size="11">14.5%</text>

    <text x="0" y="58" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Seniority Level</text>
    <rect x="130" y="50" width="125" height="10" rx="5" fill="#6366f1" fill-opacity="0.75"/>
    <text x="350" y="58" fill="#818cf8" font-family="monospace" font-size="11">12.0%</text>

    <text x="0" y="82" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Salary Spread</text>
    <rect x="130" y="74" width="110" height="10" rx="5" fill="#6366f1" fill-opacity="0.65"/>
    <text x="350" y="82" fill="#818cf8" font-family="monospace" font-size="11">10.4%</text>

    <text x="0" y="106" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Sponsored Ad</text>
    <rect x="130" y="98" width="60" height="10" rx="5" fill="#10b981" />
    <text x="350" y="106" fill="#10b981" font-family="monospace" font-size="11">5.6%</text>

    <text x="0" y="130" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Desc Word Count</text>
    <rect x="130" y="122" width="50" height="10" rx="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="350" y="130" fill="#10b981" font-family="monospace" font-size="11">4.6%</text>

    <text x="0" y="154" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Skills Count</text>
    <rect x="130" y="146" width="40" height="10" rx="5" fill="#10b981" fill-opacity="0.6"/>
    <text x="350" y="154" fill="#10b981" font-family="monospace" font-size="11">3.6%</text>
  </g>

  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="940" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#312e81" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
</svg>
