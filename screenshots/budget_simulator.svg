<svg width="1000" height="540" viewBox="0 0 1000 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="540" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="2" y="2" width="996" height="50" rx="14" fill="#0f172a" />
  <circle cx="28" cy="26" r="6" fill="#ef4444" />
  <circle cx="46" cy="26" r="6" fill="#f59e0b" />
  <circle cx="64" cy="26" r="6" fill="#10b981" />
  <text x="100" y="31" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">AdPilot • Multi-Armed Bandit Budget Optimizer Simulator</text>
  <rect x="800" y="16" width="170" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <circle cx="815" cy="28" r="4" fill="#10b981" />
  <text x="826" y="32" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">Thompson Sampling Active</text>

  <!-- Hero Lift Card -->
  <rect x="30" y="70" width="940" height="100" rx="12" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="50" y="98" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" letter-spacing="1">QUANTIFIED BUSINESS BENEFIT</text>
  <text x="50" y="126" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" font-weight="700">Thompson Sampling generated 35.36% more applications for identical $10,000 budget</text>
  <text x="50" y="150" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">601 Total Applications ($16.64 CPA) vs 444 Total Applications ($22.51 CPA on Equal Split) • $5.87 Savings / App</text>

  <!-- Left: Trajectory Chart -->
  <rect x="30" y="185" width="620" height="325" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="48" y="215" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">Cumulative Candidate Applications Over Time (30 Days)</text>
  <text x="48" y="233" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Comparison across Bayesian Bandit, Epsilon-Greedy, UCB1, and Equal Split</text>

  <!-- Chart Legends -->
  <g transform="translate(48, 248)">
    <line x1="0" y1="6" x2="16" y2="6" stroke="#10b981" stroke-width="3"/>
    <text x="22" y="10" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">Thompson Sampling (601)</text>

    <line x1="180" y1="6" x2="196" y2="6" stroke="#38bdf8" stroke-width="2"/>
    <text x="202" y="10" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">Eps-Greedy (557)</text>

    <line x1="320" y1="6" x2="336" y2="6" stroke="#c084fc" stroke-width="2"/>
    <text x="342" y="10" fill="#c084fc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">UCB1 (473)</text>

    <line x1="430" y1="6" x2="446" y2="6" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="452" y="10" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">Equal Split (444)</text>
  </g>

  <!-- Grid Lines -->
  <line x1="50" y1="280" x2="620" y2="280" stroke="#1e293b" stroke-dasharray="3 3"/>
  <line x1="50" y1="335" x2="620" y2="335" stroke="#1e293b" stroke-dasharray="3 3"/>
  <line x1="50" y1="390" x2="620" y2="390" stroke="#1e293b" stroke-dasharray="3 3"/>
  <line x1="50" y1="445" x2="620" y2="445" stroke="#1e293b" />

  <!-- Trajectory Polylines -->
  <!-- Equal Split (Gray dashed) -->
  <polyline fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 4"
    points="50,445 100,432 160,418 230,398 310,375 390,350 470,320 550,290 610,270" />
  
  <!-- UCB1 (Purple) -->
  <polyline fill="none" stroke="#c084fc" stroke-width="2"
    points="50,445 100,430 160,412 230,390 310,365 390,338 470,305 550,275 610,252" />

  <!-- Epsilon Greedy (Light Blue) -->
  <polyline fill="none" stroke="#38bdf8" stroke-width="2.5"
    points="50,445 100,425 160,400 230,370 310,340 390,300 470,265 550,230 610,205" />

  <!-- Thompson Sampling (Emerald Green) -->
  <polyline fill="none" stroke="#10b981" stroke-width="3.5"
    points="50,445 100,422 160,392 230,355 310,312 390,268 470,225 550,192 610,165" />

  <!-- Right: Channel Performance & CPA Cards -->
  <rect x="670" y="185" width="300" height="325" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="688" y="215" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700">Cost Per Application (CPA)</text>
  <text x="688" y="233" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Comparing effective acquisition costs</text>

  <!-- CPA Bars -->
  <g transform="translate(688, 255)">
    <text x="0" y="15" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Thompson Sampling</text>
    <rect x="0" y="22" width="166" height="18" rx="4" fill="#10b981"/>
    <text x="175" y="36" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">$16.64</text>

    <text x="0" y="65" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Epsilon-Greedy</text>
    <rect x="0" y="72" width="179" height="18" rx="4" fill="#38bdf8"/>
    <text x="188" y="86" fill="#38bdf8" font-family="monospace" font-size="12">$17.92</text>

    <text x="0" y="115" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">UCB1 Policy</text>
    <rect x="0" y="122" width="211" height="18" rx="4" fill="#c084fc"/>
    <text x="220" y="136" fill="#c084fc" font-family="monospace" font-size="12">$21.16</text>

    <text x="0" y="165" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Naive Equal Split</text>
    <rect x="0" y="172" width="225" height="18" rx="4" fill="#64748b"/>
    <text x="234" y="186" fill="#94a3b8" font-family="monospace" font-size="12">$22.51</text>
  </g>

  <!-- Bottom stat box -->
  <rect x="688" y="468" width="264" height="30" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="698" y="488" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700">★ 26.08% Lower Cost Per Candidate</text>
</svg>
