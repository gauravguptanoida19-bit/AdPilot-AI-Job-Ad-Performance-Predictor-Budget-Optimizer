    <text x="10" y="100" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">Structured Bullet Points (4 detected)</text>
    <text x="10" y="118" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">Clear separation of responsibilities increases applicant conversion by ~18%.</text>
