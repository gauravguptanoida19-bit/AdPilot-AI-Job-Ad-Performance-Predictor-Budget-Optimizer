    <text x="10" y="44" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">Optimal Description Length (1,142 chars)</text>
    <text x="10" y="62" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">Length is in the 800-1,800 sweet spot. Candidate mobile retention is maximized.</text>

